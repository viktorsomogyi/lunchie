<div class="ingredient-row">
  <select name="food_item_id" required>
    <option value="">{{ t('recipe.choose_ingredient') }}</option>
    {% for food in food_items %}
    <option value="{{ food.id }}"
            {% if ingredient.food_item_id == food.id or (ingredient.food_item and ingredient.food_item.id == food.id) %}selected{% endif %}>
      {{ food.name }} ({{ food.base_amount|num }} {{ food.base_unit }})
    </option>
    {% endfor %}
  </select>
  <input type="number" name="ingredient_amount" min="0" step="any" placeholder="{{ t('recipe.amount') }}" value="{{ ingredient.amount|num }}">
  <select name="ingredient_unit">
    {% for u in units %}
    <option value="{{ u }}" {% if ingredient.unit == u %}selected{% endif %}>{{ u }}</option>
    {% endfor %}
  </select>
  <button type="button" class="outline secondary small-btn"
          onclick="this.closest('.ingredient-row').remove()">
    {{ t('recipe.remove') }}
  </button>
</div>
